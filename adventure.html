<!DOCTYPE html>
<html lang="en">
<head>
    <!-- These settings help the page display correctly in different browsers and screen sizes. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Own Adventure</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- This container keeps the title, story, and choices together as one game area. -->
    <main class="adventure-container">
        <h1><img class="game-sign" src="images/choose_your_adventure_sign.png" alt="Choose Your Own Adventure"></h1>
        

        <!-- JavaScript will update this with the current story scene. -->
        <p id="character_choice">Pick your Character</p>

        <!-- JavaScript will add the choice buttons here. -->
        <div id="choices" class="choices">
            <!-- These buttons let the player choose the first character. -->
            <button id="tree"><img src="images/tree.png" alt="Popcorn tree">PopcornTree</button>
            <button id="snowman"><img src="images/snowman.png" alt="snowman">SnowMan</button>
        </div>

    </main>

    
    
</body>
</html>
