<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The head contains page information and file links. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Own Adventure</title>

    <!-- Connect the HTML file to the CSS file. -->
    <link rel="stylesheet" href="style.css">
    <!-- Connect the HTML file to the JavaScript game logic. -->
    <script src="script.js" defer></script>
</head>
<body>
    <!-- This container holds the visible game layout. -->
    <main class="adventure-container">
        <!-- The game title is shown at the top of the page. -->
        <h1><img class="game-sign" src="images/choose_your_adventure_sign.png" alt="Choose Your Own Adventure"></h1>
        

        <!-- JavaScript will update this with the current story scene. -->
        <p id="character_choice">Pick your character.</p>

        <!-- JavaScript will add the choice buttons here. -->
        <div id="choices" class="choices">
            <button id="tree"><img src="images/tree.png" alt="Popcorn tree">Popcorn Tree</button>
            <button id="snowman"><img src="images/snowman.png" alt="Snowman">Snowman</button>
        </div>

    </main>

    
    
</body>
</html>
